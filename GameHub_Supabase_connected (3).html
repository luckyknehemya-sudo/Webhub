<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameHub V2 — Gaming Discovery</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#070812;color:#f7f7fb}
a{text-decoration:none;color:inherit}.wrap{width:min(1180px,92%);margin:auto}
nav{height:70px;border-bottom:1px solid #25283d;background:#0a0b16;display:flex;align-items:center;position:sticky;top:0;z-index:20}
.nav{display:flex;align-items:center;justify-content:space-between;width:100%}.logo{font-size:23px;font-weight:900}.logo span{color:#a855f7}.navlinks{display:flex;gap:22px;color:#b7bac9;font-size:13px}.navlinks a:hover{color:#fff}
.btn{background:#15172a;border:1px solid #353951;color:#fff;padding:10px 15px;border-radius:9px;cursor:pointer}.primary{background:linear-gradient(90deg,#ef3340,#8b5cf6);border:0;font-weight:700}
.hero{margin:25px 0;padding:55px 45px;border-radius:20px;min-height:310px;background:radial-gradient(circle at 75% 45%,#71204b,#251344 35%,#0c0d18 70%);border:1px solid #303249}
.hero h1{font-size:clamp(44px,7vw,70px);text-transform:uppercase}.hero h1 span{color:#ef3340}.hero p{max-width:580px;color:#c6c8d4;line-height:1.6;margin:15px 0 22px}
.searchbar{display:flex;gap:8px;margin:22px 0}.searchbar input,.select{background:#111324;border:1px solid #353951;color:#fff;padding:14px;border-radius:10px;outline:none}.searchbar input{flex:1}.select{min-width:145px}
h2{font-size:21px;margin-bottom:15px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:25px 0 12px}.count{color:#858aa0;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#111324;border:1px solid #292c43;border-radius:13px;overflow:hidden;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-4px);border-color:#7c55e8}
.cover{height:190px;padding:15px;display:flex;align-items:flex-end;font-size:19px;font-weight:900;background:linear-gradient(135deg,#392070,#154b63)}
.c2{background:linear-gradient(135deg,#15243d,#35125d)}.c3{background:linear-gradient(135deg,#70321c,#172c47)}.c4{background:linear-gradient(135deg,#1c603c,#17315c)}.c5{background:linear-gradient(135deg,#6c1731,#24174f)}.c6{background:linear-gradient(135deg,#70520d,#2b174d)}
.body{padding:12px}.title{font-weight:700}.meta{display:flex;justify-content:space-between;color:#858aa0;font-size:12px;margin-top:7px}
#detail{display:none;margin:28px 0}.back{margin-bottom:18px}.detailbox{display:grid;grid-template-columns:330px 1fr;gap:25px;background:#111324;border:1px solid #292c43;border-radius:18px;padding:22px}.poster{min-height:420px;border-radius:13px;display:flex;align-items:flex-end;padding:20px;font-size:30px;font-weight:900;background:linear-gradient(145deg,#5320a4,#a3184a,#11152a)}
.detail h1{font-size:42px;margin-bottom:10px}.badges{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.badge{padding:7px 10px;background:#1d2034;border-radius:20px;color:#c8cad5;font-size:12px}.detail p{color:#bfc2cf;line-height:1.7;max-width:700px}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0;color:#aeb2c1;font-size:13px}.facts b{color:#fff}
.empty{text-align:center;padding:40px;color:#9297aa;display:none;border:1px dashed #34384f;border-radius:12px}
footer{margin-top:55px;border-top:1px solid #22263b;padding:28px;text-align:center;color:#72778d;font-size:12px}
@media(max-width:800px){.navlinks{display:none}.grid{grid-template-columns:repeat(2,1fr)}.detailbox{grid-template-columns:1fr}.poster{min-height:280px}.searchbar{flex-wrap:wrap}.searchbar input{min-width:100%}}
@media(max-width:500px){.grid{grid-template-columns:1fr}.hero{padding:38px 24px}.detail h1{font-size:32px}}
</style>
</head>
<body>
<nav><div class="wrap nav">
<a class="logo" href="#" onclick="showHome()">🎮 GAME<span>HUB</span></a>
<div class="navlinks"><a href="#" onclick="showHome()">HOME</a><a href="#games">GAMES</a><a href="#categories">CATEGORIES</a></div>
<button class="btn primary" onclick="alert('Accounts will be connected in the next version.')">SIGN UP</button>
</div></nav>

<main class="wrap">
<section id="home">
<div class="hero"><h1>Discover <span>Games</span></h1><p>Find action, racing, sports, adventure and multiplayer games in one place. Search the catalog and open a game to see its details.</p><button class="btn primary" onclick="document.getElementById('search').focus()">EXPLORE GAMES →</button></div>

<div class="searchbar">
<input id="search" placeholder="Search games or genres..." oninput="filterGames()">
<select class="select" id="genre" onchange="filterGames()"><option value="">All genres</option><option>Action</option><option>Adventure</option><option>Racing</option><option>Sports</option><option>Strategy</option><option>Puzzle</option></select>
</div>

<div class="toolbar"><h2 id="games">🎮 GAME CATALOG</h2><span class="count" id="count"></span></div>
<div class="grid" id="grid"></div><div class="empty" id="empty">No games match your search.</div>
</section>

<section id="detail">
<button class="btn back" onclick="showHome()">← Back to games</button>
<div class="detailbox">
<div class="poster" id="poster"></div>
<div class="detail"><h1 id="dtitle"></h1><div class="badges" id="badges"></div><p id="desc"></p><div class="facts" id="facts"></div><button class="btn primary" onclick="officialLink()">VIEW OFFICIAL SITE →</button></div>
</div>
</section>
</main>

<footer>© 2026 GameHub. Game names and trademarks belong to their respective owners.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://vakfrxsimzkgvnilmveu.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_yYclFxQg9rv7-DmxHozfxQ_50jL7H9t";
const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let games=[];
{name:"Free Fire MAX",genre:"Action",rating:"4.5",platform:"Android, iOS, PC",dev:"Garena",c:"c5",desc:"A fast-paced battle royale experience with short matches and multiplayer action.",url:"https://ff.garena.com/"},
{name:"Call of Duty: Mobile",genre:"Action",rating:"4.6",platform:"Android, iOS",dev:"Activision",c:"c2",desc:"A mobile shooter featuring multiplayer and battle royale modes.",url:"https://www.callofduty.com/mobile"},
{name:"Asphalt 9: Legends",genre:"Racing",rating:"4.7",platform:"Android, iOS, PC",dev:"Gameloft",c:"c3",desc:"Arcade racing with licensed cars, tracks and competitive events.",url:"https://asphaltlegends.com/"},
{name:"Minecraft",genre:"Adventure",rating:"4.8",platform:"Android, iOS, PC, Console",dev:"Mojang Studios",c:"c4",desc:"Explore, build and create in a block-based sandbox world.",url:"https://www.minecraft.net/"},
{name:"BGMI",genre:"Action",rating:"4.4",platform:"Android, iOS",dev:"KRAFTON",c:"c6",desc:"A multiplayer battle royale game designed for mobile players.",url:"https://www.battlegroundsmobileindia.com/"},
{name:"EA Sports FC 24",genre:"Sports",rating:"4.3",platform:"PC, Console",dev:"EA",c:"c5",desc:"Football simulation featuring clubs, players and competitive modes.",url:"https://www.ea.com/games/ea-sports-fc"},
{name:"Chess",genre:"Strategy",rating:"4.2",platform:"Web, Android, iOS",dev:"GameHub Demo",c:"c2",desc:"Classic strategy board game with online-style play planned for a future version.",url:"https://www.chess.com/"},
{name:"Sudoku",genre:"Puzzle",rating:"4.1",platform:"Web, Android, iOS",dev:"GameHub Demo",c:"c4",desc:"A number puzzle for players who enjoy logic and problem solving.",url:"https://sudoku.com/"}
];
const grid=document.getElementById("grid");

function gameClass(name){
  const classes=["c5","c2","c3","c4","c6"];
  let n=0;
  for(let i=0;i<name.length;i++) n=(n+name.charCodeAt(i))%classes.length;
  return classes[n];
}

async function loadGames(){
  const { data, error } = await supabaseClient
    .from("games")
    .select("id,name,genre,rating,platforms,developer,description,official_url,image_url")
    .order("created_at", { ascending:false });

  if(error){
    console.error("Supabase error:", error);
    document.getElementById("empty").textContent =
      "Could not load games. Check your Supabase URL/key and database permissions.";
    document.getElementById("empty").style.display="block";
    return;
  }

  games = (data || []).map(g => ({
    id:g.id,
    name:g.name || "Untitled Game",
    genre:g.genre || "Other",
    rating:g.rating ?? "—",
    platform:g.platforms || "—",
    dev:g.developer || "—",
    desc:g.description || "No description available.",
    url:g.official_url || "#",
    image:g.image_url || "",
    c:gameClass(g.name || "Game")
  }));

  render(games);
}
function render(list){
 grid.innerHTML=list.map((g,i)=>`<div class="card" onclick="openGame(${games.indexOf(g)})"><div class="cover ${g.c}">${g.name.toUpperCase()}</div><div class="body"><div class="title">${g.name}</div><div class="meta"><span>${g.genre}</span><span>★ ${g.rating}</span></div></div></div>`).join("");
 document.getElementById("count").textContent=list.length+" games";
 document.getElementById("empty").style.display=list.length?"none":"block";
}
function filterGames(){
 const q=document.getElementById("search").value.toLowerCase(), genre=document.getElementById("genre").value;
 render(games.filter(g=>(g.name+" "+g.genre+" "+g.dev).toLowerCase().includes(q)&&(!genre||g.genre===genre)));
}
function openGame(i){
 const g=games[i];document.getElementById("home").style.display="none";document.getElementById("detail").style.display="block";
 document.getElementById("poster").className="poster "+g.c;document.getElementById("poster").textContent=g.name.toUpperCase();
 document.getElementById("dtitle").textContent=g.name;document.getElementById("desc").textContent=g.desc;
 document.getElementById("badges").innerHTML=`<span class="badge">${g.genre}</span><span class="badge">★ ${g.rating}</span><span class="badge">${g.platform}</span>`;
 document.getElementById("facts").innerHTML=`<div>Developer<br><b>${g.dev}</b></div><div>Genre<br><b>${g.genre}</b></div><div>Rating<br><b>★ ${g.rating}/5</b></div><div>Platforms<br><b>${g.platform}</b></div>`;
 window.currentUrl=g.url;window.scrollTo({top:0,behavior:"smooth"});
}
function officialLink(){window.open(window.currentUrl,"_blank","noopener");}
function showHome(){document.getElementById("detail").style.display="none";document.getElementById("home").style.display="block";window.scrollTo({top:0,behavior:"smooth"});}
loadGames();
</script>
</body>
</html>
